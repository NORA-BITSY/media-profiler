[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-feature-pipeline"
version = "0.1.0"
description = "Local video feature extraction and vector indexing pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Video Feature Pipeline Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer[all]>=0.12",
    "yt-dlp>=2024.1",
    "opencv-python>=4.10",
    "mediapipe>=0.10",
    "insightface>=0.7",
    "onnxruntime>=1.18",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "watchdog>=4.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "sqlite-utils>=3.37",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.6",
]
gpu = ["onnxruntime-gpu>=1.18"]

[project.scripts]
pipeline = "video_feature_pipeline.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_feature_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "ASYNC"
]
ignore = ["S101", "S113", "PTH118", "PTH120"]
per-file-ignores = { "tests/*" = ["S101", "S113"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]